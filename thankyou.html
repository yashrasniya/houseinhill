<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(135deg, #fff7f0, #f0e4d7);
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .thankyou-container {
      background: white;
      padding: 50px 40px;
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 500px;
      width: 90%;
      animation: slideUp 0.8s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .thankyou-container h1 {
      font-size: 2.8rem;
      color: #B78D65;
      margin-bottom: 15px;
    }

    .thankyou-container p {
      font-size: 1.15rem;
      color: #555;
      margin-bottom: 30px;
    }

    .thankyou-icon {
      font-size: 50px;
      color: #B78D65;
      margin-bottom: 20px;
      animation: pop 1s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .btn-custom {
      background-color: #B78D65;
      color: white;
      padding: 12px 30px;
      border-radius: 30px;
      font-size: 1rem;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .btn-custom:hover {
      background-color: #a67448;
      color: #fff;
      box-shadow: 0 5px 15px rgba(183, 141, 101, 0.4);
    }
  </style>
</head>
<body>
  <div class="thankyou-container">
    <div class="thankyou-icon">🎉</div>
    <h1>Thank You!</h1>
    <p>Your message has been sent successfully.<br>We'll get back to you shortly.</p>
    <a href="index.html" class="btn btn-custom">Back to Home</a>
  </div>
</body>
</html>
